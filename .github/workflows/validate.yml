name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  xray-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n vhec.sh lib/render.sh lib/services.sh tests/smoke.sh
      - name: Run integration smoke test
        run: bash tests/smoke.sh
