name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  xray-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Shell syntax
        run: bash -n vhec.sh lib/render.sh lib/services.sh docker-entrypoint.sh docker-web.sh tests/smoke.sh
      - name: Run integration smoke test
        run: bash tests/smoke.sh

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build container
        run: docker build -t vhec:test .
      - name: Run container smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          docker volume create vhec-test-state >/dev/null
          cleanup() {
            docker rm -f vhec-test >/dev/null 2>&1 || true
            docker volume rm -f vhec-test-state >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          run_vhec() {
            docker rm -f vhec-test >/dev/null 2>&1 || true
            docker run --rm --entrypoint sh \
              -v vhec-test-state:/etc/vhec vhec:test \
              -c 'rm -f /etc/vhec/server.json /etc/vhec/client-v2rayng.json /etc/vhec/client-link.txt /etc/vhec/vhec.env' >/dev/null
            docker run -d --name vhec-test \
              --add-host host.docker.internal:host-gateway \
              -v vhec-test-state:/etc/vhec "$@" vhec:test >/dev/null
            for _ in $(seq 1 30); do
              if docker exec vhec-test test -s /etc/vhec/server.json 2>/dev/null; then
                break
              fi
              sleep 0.5
            done
            test "$(docker inspect -f '{{.State.Running}}' vhec-test)" = true
          }

          run_vhec
          docker exec vhec-test test -s /etc/vhec/client-v2rayng.json
          docker exec vhec-test xray run -test -config /etc/vhec/server.json
          docker exec vhec-test xray run -test -config /etc/vhec/client-v2rayng.json
          test "$(docker exec vhec-test sh -c 'printf "GET /healthz HTTP/1.0\r\n\r\n" | socat - TCP:127.0.0.1:30 | tail -n1')" = ok
          v_link="$(docker exec vhec-test cat /etc/vhec/client-link.txt)"
          test "$(docker exec vhec-test sh -c 'printf "GET /v HTTP/1.0\r\n\r\n" | socat - TCP:127.0.0.1:30 | tail -n1')" = "$v_link"
          test -z "$(docker logs vhec-test 2>&1)"
          uuid_before="$(docker exec vhec-test jq -r .uuid /etc/vhec/identity.json)"

          run_vhec
          uuid_after="$(docker exec vhec-test jq -r .uuid /etc/vhec/identity.json)"
          test "$uuid_before" = "$uuid_after"

          # Anonymous HTTP proxy: host+port alone must be sufficient. Localhost
          # is mapped to the Docker host gateway and auth fields must be absent.
          run_vhec -e OUTBOUND_TYPE=http -e OUTBOUND_HOST=127.0.0.1 -e OUTBOUND_PORT=3128
          docker exec vhec-test jq -e '.outbounds[0].protocol == "http"' /etc/vhec/server.json >/dev/null
          docker exec vhec-test jq -e '.outbounds[0].settings.address == "host.docker.internal"' /etc/vhec/server.json >/dev/null
          docker exec vhec-test jq -e '(.outbounds[0].settings | has("user") | not) and (.outbounds[0].settings | has("pass") | not)' /etc/vhec/server.json >/dev/null
          docker exec vhec-test xray run -test -config /etc/vhec/server.json
          test -z "$(docker logs vhec-test 2>&1)"

          # Anonymous SOCKS5 proxy: host+port alone must also be sufficient.
          run_vhec -e OUTBOUND_TYPE=socks -e OUTBOUND_HOST=localhost -e OUTBOUND_PORT=1080
          docker exec vhec-test jq -e '.outbounds[0].protocol == "socks"' /etc/vhec/server.json >/dev/null
          docker exec vhec-test jq -e '.outbounds[0].settings.address == "host.docker.internal"' /etc/vhec/server.json >/dev/null
          docker exec vhec-test jq -e '(.outbounds[0].settings | has("user") | not) and (.outbounds[0].settings | has("pass") | not)' /etc/vhec/server.json >/dev/null
          docker exec vhec-test xray run -test -config /etc/vhec/server.json
          test -z "$(docker logs vhec-test 2>&1)"
